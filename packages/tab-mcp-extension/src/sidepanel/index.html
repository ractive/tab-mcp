<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tab-mcp for Chrome</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
	<section class="card" aria-labelledby="ai-heading">
		<h2 id="ai-heading" class="label">AI app</h2>
		<p id="state" class="state" data-state="off" role="status">
			<span class="dot" aria-hidden="true"></span><span id="state-text">Off</span>
		</p>
		<div id="address-line" class="address" hidden>
			<code id="address" title=""></code>
			<button id="copy" type="button" class="quiet small">Copy</button>
		</div>
		<p id="problem" class="problem" hidden></p>
		<div class="buttons">
			<button id="connect" type="button" class="primary">Connect your AI app</button>
			<button id="stop" type="button" class="quiet" hidden>Turn off</button>
		</div>
	</section>

	<section class="card" aria-labelledby="tab-heading">
		<h2 id="tab-heading" class="label">This tab</h2>
		<p id="tab-title" class="tab-title">–</p>
		<p id="tab-host" class="muted"></p>
		<p id="tab-badges" class="badges"></p>
		<p id="tab-access" class="muted"></p>
		<ul id="tools" class="tools" aria-label="The page's WebMCP tools"></ul>
		<div class="buttons">
			<button id="allow-all" type="button" hidden>Allow on all sites</button>
		</div>
		<p id="allowed-all" class="muted small" hidden>
			Allowed on all sites. <button id="disallow-all" type="button" class="link">Stop</button>
		</p>
	</section>

	<details class="settings">
		<summary>Settings</summary>
		<form id="relay-form">
			<label for="relay">Relay</label>
			<div class="field">
				<input id="relay" name="relay" type="url" spellcheck="false" autocomplete="off">
				<button type="submit">Save</button>
			</div>
		</form>
		<p id="relay-problem" class="problem" hidden></p>
	</details>
</main>
<script type="module" src="./main.ts"></script>
</body>
</html>
