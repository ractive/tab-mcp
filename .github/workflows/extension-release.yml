name: Extension release

# The tab-mcp browser extension (iteration 23, kb/operations/chrome-web-store.md).
#
# Pushing a tag extension-v<version> (on a commit of main, with that version in
# packages/tab-mcp-extension/package.json) runs verify:all, builds the store
# packages tab-mcp-browser-extension-<version>-store.zip (Chrome Web Store,
# Edge Add-ons) and tab-mcp-browser-extension-firefox-<version>-store.zip
# (addons.mozilla.org), and the source archive tab-mcp-<version>-source.zip
# (for AMO's reviewers; the build checks that it builds the same Firefox zip),
# and only then creates the GitHub release with the three attached. A failed
# build leaves no release, and a published release is never changed afterwards
# (so this also works with immutable releases on).
#
#   git tag extension-v0.1.0 <merge commit on main>
#   git push origin extension-v0.1.0
#
# Do not create the release with `gh release create`: the release must come
# from this workflow, after the build. (A release created by hand is a no-op
# in release.yml, which publishes only the npm packages and the relay image.)
#
# The build job runs third-party code (bun install, the tests, Chrome) with a
# read-only token; only the release job, which runs none, may write. The
# release job attests the zips' build provenance, verifies the attestations and
# only then creates the release (DEC-182); check a release's zip with
#
#   gh attestation verify tab-mcp-browser-extension-<version>-store.zip -R ractive/tab-mcp
#
# Then three jobs publish them, each in its own environment (required
# reviewer, tags extension-v* only), only zips whose attestations verify for
# this tag: publish uploads the store zip to the Chrome Web Store as a CRX
# signed with the item's verified-upload key and submits it for review
# (ractive/release-workflows chrome-extension-publish.yml, environment
# chrome-web-store); publish-edge uploads it to Microsoft Edge Add-ons and
# submits it for certification (edge-extension-publish.yml, environment
# edge-add-ons); publish-firefox uploads the Firefox zip to addons.mozilla.org
# as a new version for review, with the source archive attached
# (firefox-extension-publish.yml, DEC-195, environment firefox-add-ons).
# extension-publish.yml runs any of them by hand, for a release whose publish
# failed.

on:
  push:
    tags: ["extension-v*"]

permissions:
  contents: read

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Chrome for Testing, pinned; the same version as in ci.yml and release.yml.
  CHROME_VERSION: "156.0.8078.80"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is a Chrome extension version on main
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#extension-v}"
          # Chrome takes 1 to 4 dot-separated integers from 0 to 65535, no leading zeros.
          if ! echo "$version" | grep -Eq '^(0|[1-9][0-9]{0,4})(\.(0|[1-9][0-9]{0,4})){0,3}$' \
            || ! echo "$version" | awk -F. '{ for (i = 1; i <= NF; i++) if ($i > 65535) exit 1 }'; then
            echo "::error::tag $TAG is not extension-v plus a Chrome extension version"
            exit 1
          fi
          # An annotated tag's GITHUB_SHA is the tag object: peel it to its commit.
          commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          git merge-base --is-ancestor "$commit" origin/main \
            || { echo "::error::tag $TAG is not on main"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: The tag matches the extension's package.json
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          actual="$(bun -e 'console.log((await Bun.file("packages/tab-mcp-extension/package.json").json()).version)')"
          test "$actual" = "$VERSION" \
            || { echo "::error::tag version $VERSION, packages/tab-mcp-extension/package.json $actual"; exit 1; }
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
      - run: bun install --frozen-lockfile
      # The pinned test Firefox, as in ci.yml (test/browsers.ts).
      - run: bunx @puppeteer/browsers@3.2.7 install firefox@stable_160.0.1 --path ~/.cache/puppeteer
      # verify and the browser tests (verify:all).
      - run: bun run verify:all
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      # The build refuses to pack a manifest with a key or host_permissions,
      # or a source map (zipStoreBuild in scripts/build.ts).
      - run: bun scripts/build.ts --store --zip
        working-directory: packages/tab-mcp-extension
      # The same for Firefox (minified too: AMO's reviewers get the source archive).
      - run: bun scripts/build.ts --firefox --store --zip
        working-directory: packages/tab-mcp-extension
      - name: The zips are the store builds of that version
        working-directory: packages/tab-mcp-extension
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          for zip in "tab-mcp-browser-extension-$VERSION-store.zip" "tab-mcp-browser-extension-firefox-$VERSION-store.zip"; do
            manifest="$(unzip -p "$zip" manifest.json)"
            test "$(jq -r .version <<<"$manifest")" = "$VERSION" \
              || { echo "::error::$zip: the manifest's version is not $VERSION"; exit 1; }
            jq -e 'has("key") or has("host_permissions") | not' <<<"$manifest" >/dev/null \
              || { echo "::error::$zip: not a store build (a key or install-time host access)"; exit 1; }
            # grep -c reads all of its input, so unzip never gets SIGPIPE.
            maps="$(unzip -Z1 "$zip" | grep -c '\.map$' || true)"
            test "$maps" = 0 || { echo "::error::$zip has $maps source maps"; exit 1; }
            sha256sum "$zip"
          done
      # For addons.mozilla.org's reviewers, who must be able to build the
      # Firefox zip from source: tab-mcp-<version>-source.zip, the built
      # commit's files and the time its zip entries carry, packed and then
      # built as the reviewers' notes say; it fails unless that gives the
      # Firefox zip above byte for byte. ci.yml runs the same script on every
      # pull request.
      - name: The source archive builds the same Firefox zip
        working-directory: packages/tab-mcp-extension
        env:
          BUILT: ${{ steps.tag.outputs.commit }}
        run: bun scripts/source-archive.ts --commit "$BUILT" --built
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zips
          path: |
            packages/tab-mcp-extension/tab-mcp-browser-extension-*-store.zip
            packages/tab-mcp-extension/tab-mcp-*-source.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      # Build provenance for the zips (DEC-182): the OIDC token signs it with a
      # Sigstore certificate, attestations: write stores it in the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zips
          path: release-zips
      - name: The tag still points at the commit that was built
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BUILT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          # A tag moved since the push would get zips of another commit. This
          # API peels an annotated tag to its commit.
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)"
          test "$tagged" = "$BUILT" \
            || { echo "::error::tag $TAG is at $tagged, this run built $BUILT"; exit 1; }
      - name: The downloaded zips are that version's, and nothing else
        env:
          VERSION: ${{ needs.build.outputs.version }}
        working-directory: release-zips
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' "tab-mcp-$VERSION-source.zip" \
            "tab-mcp-browser-extension-$VERSION-store.zip" \
            "tab-mcp-browser-extension-firefox-$VERSION-store.zip")"
          actual="$(find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          test "$actual" = "$(LC_ALL=C sort <<<"$expected")" \
            || { echo "::error::the release-zips artifact holds: $actual"; exit 1; }
          # The build job printed the same lines.
          sha256sum -- *.zip
      # SLSA build provenance for exactly the files the next steps attach
      # (DEC-182). It is signed here, in the job that runs no third-party code,
      # not in the build job, which keeps its read-only token.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-zips/*.zip
      - name: The zips' attestations verify
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-zips
        run: |
          set -euo pipefail
          # Fetched from the repository's attestations, as anyone checks them:
          # signed by this workflow, for this tag.
          for zip in *.zip; do
            gh attestation verify "$zip" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/extension-release.yml" \
              --source-ref "$GITHUB_REF"
          done
      - name: Create the release with the zips
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        working-directory: release-zips
        run: |
          set -euo pipefail
          gh release create "$TAG" ./*.zip --repo "$GITHUB_REPOSITORY" \
            --verify-tag --latest=false --title "tab-mcp browser extension $VERSION" \
            --notes "The store packages of the tab-mcp browser extension $VERSION (no key, no install-time host access, no source maps): tab-mcp-browser-extension-$VERSION-store.zip for the Chrome Web Store and Microsoft Edge Add-ons, tab-mcp-browser-extension-firefox-$VERSION-store.zip for addons.mozilla.org, and tab-mcp-$VERSION-source.zip, the source of the built commit, from which the Firefox zip builds byte for byte. What changed: packages/tab-mcp-extension/CHANGELOG.md. Verify a zip before uploading it: gh attestation verify <zip> -R $GITHUB_REPOSITORY"
      - name: The release's assets are the attested zips
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: release-zips
        run: |
          set -euo pipefail
          # GitHub records each release asset's SHA-256 on upload. This runs
          # after the release exists: on a mismatch, delete that release by hand.
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | "\(.name) \(.digest)"')"
          for zip in *.zip; do
            digest="$(awk -v n="$zip" '$1 == n { print $2 }' <<<"$assets")"
            echo "release asset $zip: $digest"
            test "$digest" = "sha256:$(sha256sum "$zip" | cut -d' ' -f1)" \
              || { echo "::error::the release's $zip is $digest, not the attested zip"; exit 1; }
          done

  publish:
    needs: release
    uses: ractive/release-workflows/.github/workflows/chrome-extension-publish.yml@ea1fdf1ab5602ac55fa78f2d10e65d9dc4d5cd24 # v0.6.0
    # The job runs in the environment chrome-web-store, whose secrets a
    # reusable workflow sees only when the caller passes them on: inherit
    # (the repository has no secrets of its own, so only the environment's).
    secrets: inherit
    permissions:
      contents: read
      # gh attestation verify reads the zip's attestation.
      attestations: read
    with:
      tag: ${{ github.ref_name }}
      tag-prefix: extension-v
      asset: tab-mcp-browser-extension-{version}-store.zip
      extension-id: jjhddplkjikmbpcobcnfebnglgjomfgh
      attest-signer-workflow: .github/workflows/extension-release.yml
      # The CRX id of CWS_CRX_PRIVATE_KEY, whose public key the item has under
      # "Verified CRX uploads" (kb/operations/chrome-web-store.md).
      signing-key-id: jbpcbkngalkckpjgonfkhhcipjmnnofh

  publish-edge:
    # Beside the Chrome Web Store job, not after it: one store's failure does
    # not hold back the other. Each waits for the owner's approval in its own
    # environment.
    needs: release
    uses: ractive/release-workflows/.github/workflows/edge-extension-publish.yml@f1fde0fc2dfb016201659084f5d9d4f2ad2cea5a # v0.7.0
    # The environment edge-add-ons (required reviewer, tags extension-v* only)
    # holds EDGE_CLIENT_ID and EDGE_API_KEY; inherit passes them on, as above.
    secrets: inherit
    permissions:
      contents: read
      attestations: read
    with:
      tag: ${{ github.ref_name }}
      tag-prefix: extension-v
      asset: tab-mcp-browser-extension-{version}-store.zip
      # The Edge Add-ons item (its Product ID; the CRX id is
      # dajcihibbfmlghajafpckpgefkkjgogn, which the hosted relay allows).
      product-id: a9ff25ac-7200-4573-8eee-69473a630ae7
      attest-signer-workflow: .github/workflows/extension-release.yml
      notes: >-
        Test page: https://ractive.ch/tab-mcp/examples/diagram/ (registers 8 WebMCP tools).
        Click the toolbar icon on it; the side panel lists the tools. Turning on AI access
        shows an address and a pairing code for an MCP client such as Claude Code:
        claude mcp add --transport http tab-mcp-browser-extension <address>.
        Where Edge has no WebMCP, the extension supplies document.modelContext after
        "Give access to all sites" and a reload of the page.
        Source: https://github.com/ractive/tab-mcp (packages/tab-mcp-extension); the package
        is the release zip of tag ${{ github.ref_name }}, with GitHub build provenance
        (gh attestation verify <zip> -R ractive/tab-mcp).

  publish-firefox:
    # Beside the other two, not after them: one store's failure does not hold
    # back the others. Waits for the owner's approval in its own environment.
    needs: release
    uses: ractive/release-workflows/.github/workflows/firefox-extension-publish.yml@d69f242378f228560fdf2fb7ce851c2d8fb6a11e # v0.8.1
    # The environment firefox-add-ons (required reviewer, tags extension-v*
    # only) holds AMO_JWT_ISSUER and AMO_JWT_SECRET; inherit passes them on.
    secrets: inherit
    permissions:
      contents: read
      attestations: read
    with:
      tag: ${{ github.ref_name }}
      tag-prefix: extension-v
      asset: tab-mcp-browser-extension-firefox-{version}-store.zip
      source-asset: tab-mcp-{version}-source.zip
      addon-id: tab-mcp@ractive.ch
      attest-signer-workflow: .github/workflows/extension-release.yml
      notes: >-
        Build (the scripts are bundled and minified with Bun's bundler; no other tools):
        install Bun 1.4.4 (https://bun.sh); unzip the attached tab-mcp-<version>-source.zip
        and cd into tab-mcp-<version>; bun install --frozen-lockfile; cd
        packages/tab-mcp-extension; SOURCE_DATE_EPOCH=$(cat ../../SOURCE_DATE_EPOCH) bun
        scripts/build.ts --firefox --store --zip. This writes
        tab-mcp-browser-extension-firefox-<version>-store.zip, byte for byte the uploaded
        file (the release workflow checks that); dist-firefox-store/ holds the unpacked
        files. SOURCE_DATE_EPOCH only sets the zip entries' time (the archive has no Git
        history). Sources: packages/tab-mcp-extension/src (background: worker/, content
        scripts: content.ts with firefox/webmcp.ts, and pairing-page.ts; sidebar:
        sidepanel/), and the library packages/tab-mcp-client/src, which it bundles.
        What it does: it gives pages document.modelContext (WebMCP), which Firefox lacks,
        from its content script, so pages can register tools for AI agents. When the user
        turns on AI access in the sidebar and connects an AI app (Claude, ChatGPT, ...) with
        a code, the extension connects to a tab-mcp relay (default
        https://tab-mcp.ractive.ch, run by the developer) over a WebSocket and lets that AI
        app list and call the tools of the page in front. A tool that is not marked
        read-only asks the user first. No remote code is executed: the relay connection
        carries data only (tool lists, calls, results). Host access is optional and asked
        for at runtime: per tab with a click on the toolbar icon, for all sites when the
        user clicks "Give access to all sites", or for the relay's site alone when the user
        turns on "Fill in the code for me" (off by default): then pairing.js runs on the
        relay's sign-in page only and, after the user allows it, fills in the code there.
        Testing: open https://ractive.ch/tab-mcp/examples/diagram/ (a page with WebMCP
        tools), click the toolbar icon, the sidebar shows its tools. Connecting an AI app
        needs an MCP client such as Claude Code: claude mcp add --transport http
        tab-mcp-browser-extension-firefox <address shown in the sidebar>.
        Privacy policy: https://ractive.ch/tab-mcp/privacy/. Source and issues:
        https://github.com/ractive/tab-mcp; this is the release of tag ${{ github.ref_name }},
        with GitHub build provenance (gh attestation verify <zip> -R ractive/tab-mcp).
