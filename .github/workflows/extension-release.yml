name: Extension release

# The tab-mcp browser extension (iteration 23, kb/operations/chrome-web-store.md).
#
# Pushing a tag extension-v<version> (on a commit of main, with that version in
# packages/tab-mcp-extension/package.json) runs verify:all, builds the store
# package tab-mcp-browser-extension-<version>-store.zip, and only then creates the
# GitHub release with the zip attached. A failed build leaves no release, and a
# published release is never changed afterwards (so this also works with
# immutable releases on).
#
#   git tag extension-v0.1.0 <merge commit on main>
#   git push origin extension-v0.1.0
#
# Do not create the release with `gh release create`: the release must come
# from this workflow, after the build. (A release created by hand is a no-op
# in release.yml, which publishes only the npm packages and the relay image.)
#
# The build job runs third-party code (bun install, the tests, Chrome) with a
# read-only token; only the release job, which runs none, may write. The
# release job attests the zip's build provenance, verifies the attestation and
# only then creates the release (DEC-182); check a release's zip with
#
#   gh attestation verify tab-mcp-browser-extension-<version>-store.zip -R ractive/tab-mcp
#
# Then two jobs publish that zip, each in its own environment (required
# reviewer, tags extension-v* only), only a zip whose attestation verifies for
# this tag: publish uploads it to the Chrome Web Store as a CRX signed with the
# item's verified-upload key and submits it for review
# (ractive/release-workflows chrome-extension-publish.yml, environment
# chrome-web-store); publish-edge uploads it to Microsoft Edge Add-ons and
# submits it for certification (edge-extension-publish.yml, environment
# edge-add-ons). extension-publish.yml runs either by hand, for a release whose
# publish failed.

on:
  push:
    tags: ["extension-v*"]

permissions:
  contents: read

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Chrome for Testing, pinned; the same version as in ci.yml and release.yml.
  CHROME_VERSION: "156.0.8078.80"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is a Chrome extension version on main
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#extension-v}"
          # Chrome takes 1 to 4 dot-separated integers from 0 to 65535, no leading zeros.
          if ! echo "$version" | grep -Eq '^(0|[1-9][0-9]{0,4})(\.(0|[1-9][0-9]{0,4})){0,3}$' \
            || ! echo "$version" | awk -F. '{ for (i = 1; i <= NF; i++) if ($i > 65535) exit 1 }'; then
            echo "::error::tag $TAG is not extension-v plus a Chrome extension version"
            exit 1
          fi
          # An annotated tag's GITHUB_SHA is the tag object: peel it to its commit.
          commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          git merge-base --is-ancestor "$commit" origin/main \
            || { echo "::error::tag $TAG is not on main"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: The tag matches the extension's package.json
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          actual="$(bun -e 'console.log((await Bun.file("packages/tab-mcp-extension/package.json").json()).version)')"
          test "$actual" = "$VERSION" \
            || { echo "::error::tag version $VERSION, packages/tab-mcp-extension/package.json $actual"; exit 1; }
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
      - run: bun install --frozen-lockfile
      # verify and the browser tests (verify:all).
      - run: bun run verify:all
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      # The build refuses to pack a manifest with a key or host_permissions,
      # or a source map (zipStoreBuild in scripts/build.ts).
      - run: bun scripts/build.ts --store --zip
        working-directory: packages/tab-mcp-extension
      - name: The zip is the store build of that version
        working-directory: packages/tab-mcp-extension
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          zip="tab-mcp-browser-extension-$VERSION-store.zip"
          manifest="$(unzip -p "$zip" manifest.json)"
          test "$(jq -r .version <<<"$manifest")" = "$VERSION" \
            || { echo "::error::the manifest's version is not $VERSION"; exit 1; }
          jq -e 'has("key") or has("host_permissions") | not' <<<"$manifest" >/dev/null \
            || { echo "::error::not a store build (a key or install-time host access)"; exit 1; }
          # grep -c reads all of its input, so unzip never gets SIGPIPE.
          maps="$(unzip -Z1 "$zip" | grep -c '\.map$' || true)"
          test "$maps" = 0 || { echo "::error::the zip has $maps source maps"; exit 1; }
          sha256sum "$zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-zip
          path: packages/tab-mcp-extension/tab-mcp-browser-extension-*-store.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      # Build provenance for the zip (DEC-182): the OIDC token signs it with a
      # Sigstore certificate, attestations: write stores it in the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-zip
      - name: The tag still points at the commit that was built
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BUILT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          # A tag moved since the push would get a zip of another commit. This
          # API peels an annotated tag to its commit.
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)"
          test "$tagged" = "$BUILT" \
            || { echo "::error::tag $TAG is at $tagged, this run built $BUILT"; exit 1; }
      - name: The downloaded zip is the store zip of that version
        id: zip
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          zip="tab-mcp-browser-extension-$VERSION-store.zip"
          test -f "$zip" || { echo "::error::no $zip in the store-zip artifact"; exit 1; }
          # The build job printed the same line.
          sha256sum "$zip"
          echo "path=$zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # SLSA build provenance for exactly the file the next steps attach
      # (DEC-182). It is signed here, in the job that runs no third-party code,
      # not in the build job, which keeps its read-only token.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.zip.outputs.path }}
      - name: The zip's attestation verifies
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.zip.outputs.path }}
        run: |
          set -euo pipefail
          # Fetched from the repository's attestations, as anyone checks it:
          # signed by this workflow, for this tag.
          gh attestation verify "$ZIP" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/extension-release.yml" \
            --source-ref "$GITHUB_REF"
      - name: Create the release with the store zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          ZIP: ${{ steps.zip.outputs.path }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --latest=false --title "tab-mcp browser extension $VERSION" \
            --notes "The store package (Chrome Web Store, Microsoft Edge Add-ons) of the tab-mcp browser extension $VERSION (no key, no install-time host access, no source maps). What changed: packages/tab-mcp-extension/CHANGELOG.md. Verify it before uploading: gh attestation verify $ZIP -R $GITHUB_REPOSITORY"
      - name: The release's asset is the attested zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.zip.outputs.path }}
          SHA256: ${{ steps.zip.outputs.sha256 }}
        run: |
          set -euo pipefail
          # GitHub records each release asset's SHA-256 on upload. This runs
          # after the release exists: on a mismatch, delete that release by hand.
          digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq ".assets[] | select(.name == \"$ZIP\") | .digest")"
          echo "release asset $ZIP: $digest"
          test "$digest" = "sha256:$SHA256" \
            || { echo "::error::the release's $ZIP is $digest, the attested zip sha256:$SHA256"; exit 1; }

  publish:
    needs: release
    uses: ractive/release-workflows/.github/workflows/chrome-extension-publish.yml@ea1fdf1ab5602ac55fa78f2d10e65d9dc4d5cd24 # v0.6.0
    # The job runs in the environment chrome-web-store, whose secrets a
    # reusable workflow sees only when the caller passes them on: inherit
    # (the repository has no secrets of its own, so only the environment's).
    secrets: inherit
    permissions:
      contents: read
      # gh attestation verify reads the zip's attestation.
      attestations: read
    with:
      tag: ${{ github.ref_name }}
      tag-prefix: extension-v
      asset: tab-mcp-browser-extension-{version}-store.zip
      extension-id: jjhddplkjikmbpcobcnfebnglgjomfgh
      attest-signer-workflow: .github/workflows/extension-release.yml
      # The CRX id of CWS_CRX_PRIVATE_KEY, whose public key the item has under
      # "Verified CRX uploads" (kb/operations/chrome-web-store.md).
      signing-key-id: jbpcbkngalkckpjgonfkhhcipjmnnofh

  publish-edge:
    # Beside the Chrome Web Store job, not after it: one store's failure does
    # not hold back the other. Each waits for the owner's approval in its own
    # environment.
    needs: release
    uses: ractive/release-workflows/.github/workflows/edge-extension-publish.yml@f1fde0fc2dfb016201659084f5d9d4f2ad2cea5a # v0.7.0
    # The environment edge-add-ons (required reviewer, tags extension-v* only)
    # holds EDGE_CLIENT_ID and EDGE_API_KEY; inherit passes them on, as above.
    secrets: inherit
    permissions:
      contents: read
      attestations: read
    with:
      tag: ${{ github.ref_name }}
      tag-prefix: extension-v
      asset: tab-mcp-browser-extension-{version}-store.zip
      # The Edge Add-ons item (its Product ID; the CRX id is
      # dajcihibbfmlghajafpckpgefkkjgogn, which the hosted relay allows).
      product-id: a9ff25ac-7200-4573-8eee-69473a630ae7
      attest-signer-workflow: .github/workflows/extension-release.yml
      notes: >-
        Test page: https://ractive.ch/tab-mcp/examples/diagram/ (registers 8 WebMCP tools).
        Click the toolbar icon on it; the side panel lists the tools. Turning on AI access
        shows an address and a pairing code for an MCP client such as Claude Code:
        claude mcp add --transport http tab-mcp-browser-extension <address>.
        Where Edge has no WebMCP, the extension supplies document.modelContext after
        "Give access to all sites" and a reload of the page.
        Source: https://github.com/ractive/tab-mcp (packages/tab-mcp-extension); the package
        is the release zip of tag ${{ github.ref_name }}, with GitHub build provenance
        (gh attestation verify <zip> -R ractive/tab-mcp).
