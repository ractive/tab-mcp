name: Browser tests (full)

# Every browser test, Chrome and Firefox, nothing left out: `bun run
# test:browser`, with the files a pull request's browser job leaves out
# (*-full.browser.test.ts: the rest of Firefox; ci.yml runs `--no-full`) and
# the opt-in idle test of the extension's service worker (TAB_MCP_E2E_IDLE).
# Iteration 50, task 9.
#
# Nightly, on demand, and on a change to main in what these tests cover: the
# extension, the client library, the relay, the harnesses and scripts, the
# packages' manifests, the pins and the lockfile. On a pull request only when
# it changes this workflow or ci.yml (where the browser pins are). The nightly
# run is this repository's only, not a fork's.
#
# Not a required check: a path-filtered workflow does not report on most pull
# requests, and a required check that never reports blocks the merge. A red
# run on main (nightly, on demand or after a change), a timed-out one too,
# opens an issue labelled browser-full with the failing tests, or comments on
# the open one; a green run of main's current head closes it
# (scripts/browser-full-issue.ts).

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/tab-mcp-extension/**
      - packages/tab-mcp-client/src/**
      - packages/tab-mcp-client/test/**
      - packages/tab-mcp/src/**
      - "**/package.json"
      - test/**
      - scripts/**
      - bun.lock
      - .github/workflows/ci.yml
      - .github/workflows/browser-full.yml
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/browser-full.yml

permissions:
  contents: read

concurrency:
  group: browser-full-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The same pin as in ci.yml.
  CHROME_VERSION: "156.0.8078.80"

jobs:
  browser:
    # A fork's Actions do not run the nightly (they may still run it by hand).
    if: github.event_name != 'schedule' || github.repository == 'ractive/tab-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # The pinned test browsers, as in ci.yml.
      - name: The pinned test Firefox
        run: bunx @puppeteer/browsers@3.2.7 install firefox@stable_160.0.1 --path ~/.cache/puppeteer
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
      - run: bun install --frozen-lockfile
      # A hang fails the step with its log, well before the job's own limit
      # (a job past that limit counts as cancelled, and nobody would hear of
      # it). The step's exit code is the tests' (pipefail), or timeout's.
      - shell: bash
        run: |
          set -o pipefail
          status=0
          timeout --kill-after=60s 25m bun run test:browser 2>&1 | tee browser-full.log || status=$?
          if [ "$status" = 124 ] || [ "$status" = 137 ]; then
            echo "browser-full: timed out after 25 minutes" | tee -a browser-full.log
          fi
          exit "$status"
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          # The service worker on a quiet connection, over two minutes:
          # opt-in elsewhere (extension.browser.test.ts), always here.
          TAB_MCP_E2E_IDLE: "1"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-full-log
          path: browser-full.log
          if-no-files-found: ignore
          retention-days: 14

  # The issue: on main only, never for a pull request (its run shows there)
  # and not for a cancelled run; only in this repository. A job of its own,
  # so the test run's job gets no write access.
  report:
    needs: [browser]
    if: always() && github.repository == 'ractive/tab-mcp' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (needs.browser.result == 'success' || needs.browser.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - if: needs.browser.result == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-full-log
        continue-on-error: true
      - run: bun scripts/browser-full-issue.ts
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.browser.result }}
          LOG: browser-full.log
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
