name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Chrome for Testing, pinned so a Chrome release cannot change a run; bump
  # it on purpose (the same version as in release.yml).
  CHROME_VERSION: "156.0.8078.47"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # The browser tests (the client's and the calculator e2e) need Chrome;
      # in CI they fail instead of skipping without it.
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run verify
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
