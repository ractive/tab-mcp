name: CI

# Two jobs in parallel: verify (Biome, type check, the tests without a
# browser, conformance; the required check of main) and browser (the
# *.browser.test.ts files, scripts/test-browser.ts). No path filter: a
# required check that never reports leaves a pull request unmergeable. A pull
# request that changes only kb/ (which no build and no test reads) passes both
# jobs at once instead.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Chrome for Testing, pinned so a Chrome release cannot change a run; bump
  # it on purpose (the same version as in release.yml).
  CHROME_VERSION: "156.0.8078.80"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base: what the pull
          # request changes.
          fetch-depth: 2
          # The release tags, for the skill's links at a release's tag
          # (packages/tab-mcp-client/test/skill.test.ts, DEC-216).
          fetch-tags: true
      - name: Changes outside kb/
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] && git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qv '^kb/'; then
              echo "Only kb/ changed: nothing to build or test."
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - if: steps.changes.outputs.code == 'true'
        run: bun install --frozen-lockfile
      - if: steps.changes.outputs.code == 'true'
        run: bun run verify

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Changes outside kb/
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] && git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qv '^kb/'; then
              echo "Only kb/ changed: nothing to build or test."
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # The Chrome tests fail instead of skipping without Chrome in CI. The
      # Firefox tests use the runner's preinstalled Firefox.
      - if: steps.changes.outputs.code == 'true'
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
      - if: steps.changes.outputs.code == 'true'
        run: bun install --frozen-lockfile
      - if: steps.changes.outputs.code == 'true'
        run: bun run test:browser
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
