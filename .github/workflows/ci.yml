name: CI

# Two test jobs in parallel: fast (Biome, type check, the tests without a
# browser, conformance: `bun run verify`) and browser (the *.browser.test.ts
# files but the full run's: `bun run test:browser --no-full`; all of them run
# in browser-full.yml, not required). The job verify, the required check of main,
# waits for both and passes only when both passed, so a red browser job blocks
# a merge as before the split (DEC-218). No path filter: a required check that
# never reports leaves a pull request unmergeable. A pull request that changes
# only kb/ (which no build and no test reads) passes both test jobs at once
# instead (scripts/ci-changes.sh), so verify passes too.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Chrome for Testing, pinned so a Chrome release cannot change a run; bump
  # it on purpose (the same version as in release.yml).
  CHROME_VERSION: "156.0.8078.80"

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base: what the pull
          # request changes.
          fetch-depth: 2
          # The release tags, for the skill's links at a release's tag
          # (packages/tab-mcp-client/test/skill.test.ts, DEC-216).
          fetch-tags: true
      - name: Changes outside kb/
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: bash scripts/ci-changes.sh
      - if: steps.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - if: steps.changes.outputs.code == 'true'
        run: bun install --frozen-lockfile
      - if: steps.changes.outputs.code == 'true'
        run: bun run verify

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Changes outside kb/
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: bash scripts/ci-changes.sh
      - if: steps.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # The pinned test browsers (test/browsers.ts): Chrome for Testing from
      # setup-chrome, the test Firefox from Puppeteer's cache, as locally
      # (not the runner image's own). test:browser prints both with their version.
      - if: steps.changes.outputs.code == 'true'
        name: The pinned test Firefox
        run: bunx @puppeteer/browsers@3.2.7 install firefox@stable_160.0.1 --path ~/.cache/puppeteer
      - if: steps.changes.outputs.code == 'true'
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: ${{ env.CHROME_VERSION }}
      - if: steps.changes.outputs.code == 'true'
        run: bun install --frozen-lockfile
      # Every browser file but the full run's (*-full.browser.test.ts: the
      # rest of Firefox), which browser-full.yml runs.
      - if: steps.changes.outputs.code == 'true'
        run: bun run test:browser --no-full
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  # The required check. It runs even when a test job failed or was cancelled
  # (always()), and fails unless both report success; a kb-only pull request's
  # test jobs report success (their steps are skipped, not the jobs).
  verify:
    needs: [fast, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both test jobs passed
        env:
          FAST: ${{ needs.fast.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "fast: $FAST, browser: $BROWSER"
          test "$FAST" = success
          test "$BROWSER" = success
