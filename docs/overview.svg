<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 276" width="940" height="276" role="img" aria-labelledby="tmo-title tmo-desc">
  <title id="tmo-title">tab-mcp: how the parts connect</title>
  <desc id="tmo-desc">Two paths lead through the tab-mcp relay to AI apps such as Claude, ChatGPT, Claude Code and Codex. First path: a page with tab-mcp-client, in any browser, with nothing for the user to install, connects to the relay with a WebSocket. Second path: in Chrome with WebMCP on and the tab-mcp extension installed, the extension tab-mcp for Chrome reads the WebMCP tools of a page and connects to the relay with a WebSocket. The AI apps reach the relay over MCP.</desc>
  <!-- Drawn by hand in the look of the diagrams on https://ractive.ch/tab-mcp/
       (scripts/flowchart.ts and src/css/tab-mcp-overview.css in ractive/ractive.ch):
       their boxes, arrows, label tags and colours, light and dark. It is a file of
       its own, not that renderer's output, because the README needs a picture that
       stands by itself. A copy of this file is static/images/tab-mcp-overview.svg
       in ractive.ch; keep the two in step. Text is set in the reader's own font:
       leave room in the boxes. -->
  <style>
    .card { fill: #fffcf1; stroke: #d9d3b8; }
    .box { fill: #faf4d4; stroke: #00362a; stroke-width: 1.5; }
    .frame { fill: none; stroke: #45655b; stroke-dasharray: 5 4; }
    .line { stroke: #1e1c09; stroke-width: 1.5; }
    .head { fill: #1e1c09; }
    .tag { fill: #fffcf1; }
    .icon { fill: none; stroke: #00362a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .logo { stroke-width: 11; }
    .dot { fill: #00362a; }
    text { fill: #1e1c09; font-family: Inter, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 12.5px; }
    .label { font-size: 14px; font-weight: 600; }
    .muted { fill: #45655b; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #1e1c14; stroke: #2e2c22; }
      .box { fill: #222018; stroke: #7abfa8; }
      .frame { stroke: #8a9a92; }
      .line { stroke: #e8e2c8; }
      .head { fill: #e8e2c8; }
      .tag { fill: #1e1c14; }
      .icon { stroke: #7abfa8; }
      .dot { fill: #7abfa8; }
      text { fill: #e8e2c8; }
      .muted { fill: #8a9a92; }
    }
  </style>
  <defs>
    <marker id="tmo-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
    <!-- a browser window, for a page -->
    <g id="tmo-page">
      <rect class="icon" x="1.5" y="3.5" width="21" height="17" rx="3"/>
      <path class="icon" d="M1.5 9 H22.5"/>
      <circle class="dot" cx="5" cy="6.3" r="1"/>
      <circle class="dot" cx="8.2" cy="6.3" r="1"/>
    </g>
    <!-- a puzzle piece, for the extension -->
    <path id="tmo-extension" class="icon" d="M4 8 H8.5 A2.6 2.6 0 1 1 12.5 8 H17 V12.5 A2.6 2.6 0 1 1 17 16.5 V21 H4 Z"/>
    <!-- the MCP logo, for the relay -->
    <g id="tmo-relay" class="icon logo" transform="translate(-1.2 -1.8) scale(0.135)">
      <path d="M25 97.85L92.88 29.97C102.26 20.6 117.45 20.6 126.82 29.97C136.2 39.34 136.2 54.54 126.82 63.91L75.56 115.18"/>
      <path d="M76.27 114.47L126.82 63.91C136.2 54.54 151.39 54.54 160.77 63.91L161.12 64.27C170.49 73.64 170.49 88.83 161.12 98.21L99.72 159.6C96.6 162.72 96.6 167.79 99.72 170.91L112.33 183.52"/>
      <path d="M109.85 46.94L59.65 97.15C50.28 106.52 50.28 121.71 59.65 131.09C69.02 140.46 84.22 140.46 93.59 131.09L143.79 80.88"/>
    </g>
    <!-- the AI app of tab-mcp's card image: an app icon with the AI's spark -->
    <g id="tmo-ai" transform="scale(0.2308)">
      <rect width="104" height="104" rx="25" fill="#ffb03a"/>
      <path d="M52 17 Q56 48 87 52 Q56 56 52 87 Q48 56 17 52 Q48 48 52 17 Z" fill="#fffae3"/>
      <path d="M81 15 Q82.5 24 91 25.5 Q82.5 27 81 36 Q79.5 27 71 25.5 Q79.5 24 81 15 Z" fill="#fffae3"/>
    </g>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="939" height="275" rx="12"/>

  <!-- what the user's browser needs: one frame per path -->
  <rect class="frame" x="24" y="24" width="436" height="104" rx="12"/>
  <text class="muted" x="38" y="46">Any browser, nothing for the user to install</text>
  <rect class="frame" x="24" y="148" width="436" height="104" rx="12"/>
  <text class="muted" x="38" y="170">Chrome with WebMCP on, and the tab-mcp extension installed</text>

  <!-- the links, and their labels on them -->
  <g marker-start="url(#tmo-arrow)" marker-end="url(#tmo-arrow)">
    <line class="line" x1="208" y1="86" x2="588" y2="124"/>
    <line class="line" x1="208" y1="210" x2="296" y2="210"/>
    <line class="line" x1="448" y1="210" x2="588" y2="152"/>
    <line class="line" x1="724" y1="138" x2="802" y2="138"/>
  </g>
  <g text-anchor="middle">
    <rect class="tag" x="361" y="94.5" width="74" height="21" rx="4"/>
    <text x="398" y="109.5">WebSocket</text>
    <rect class="tag" x="222" y="199.5" width="60" height="21" rx="4"/>
    <text x="252" y="214.5">WebMCP</text>
    <rect class="tag" x="481" y="170.5" width="74" height="21" rx="4"/>
    <text x="518" y="185.5">WebSocket</text>
    <rect class="tag" x="744" y="127.5" width="38" height="21" rx="4"/>
    <text x="763" y="142.5">MCP</text>
  </g>

  <!-- the page with the client library -->
  <rect class="box" x="38" y="58" width="168" height="56" rx="10"/>
  <use href="#tmo-page" x="50" y="74"/>
  <text class="label" x="84" y="81">Page with</text>
  <text class="label" x="84" y="99">tab-mcp-client</text>

  <!-- the page with WebMCP tools only, and the extension that reads them -->
  <rect class="box" x="38" y="182" width="168" height="56" rx="10"/>
  <use href="#tmo-page" x="50" y="198"/>
  <text class="label" x="84" y="205">Page with</text>
  <text class="label" x="84" y="223">WebMCP tools</text>
  <rect class="box" x="298" y="182" width="148" height="56" rx="10"/>
  <use href="#tmo-extension" x="310" y="198"/>
  <text class="label" x="344" y="205">tab-mcp</text>
  <text class="label" x="344" y="223">for Chrome</text>

  <!-- the relay -->
  <rect class="box" x="590" y="110" width="132" height="56" rx="10"/>
  <use href="#tmo-relay" x="602" y="126"/>
  <text class="label" x="636" y="133">tab-mcp</text>
  <text class="label" x="636" y="151">relay</text>

  <!-- the AI apps -->
  <rect class="box" x="804" y="110" width="112" height="56" rx="10"/>
  <use href="#tmo-ai" x="816" y="126"/>
  <text class="label" x="850" y="143">AI apps</text>
  <text class="muted" x="860" y="187" text-anchor="middle">Claude, ChatGPT,</text>
  <text class="muted" x="860" y="204" text-anchor="middle">Claude Code, Codex</text>
</svg>
